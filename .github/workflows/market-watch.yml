# Intraday alerts for SPY, Bitcoin and Zcash. A cheap no-AI check every 30 minutes; Claude only runs when it fires.
# Needs two repo secrets: NTFY_TOPIC (your private ntfy topic name) and ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN, see research job).
#
# Three jobs, each on its own fresh machine:
#   watch    (write access)  price + news check, first push, save cooldown state. No AI.
#   research (READ-ONLY)     Claude researches the move. It reads web pages, which could carry hidden instructions,
#                            so this job's GitHub token can only read a public repo: worthless if it ever leaked.
#   publish  (write access)  commits the report Claude wrote and sends the second push. No AI.
name: market-watch

on:
  # Every 30 min, 8 AM to 11 PM Eastern, every day (crypto trades weekends): ~31 runs/day. Free on a public repo; a
  # private fork uses ~930 of its 2,000 free minutes a month. GitHub can start scheduled runs late or skip them when busy.
  # ponytail: cron is UTC and fixed to EST (UTC-5); during daylight time it runs 9 AM to midnight Eastern.
  # Shift every hour down by one in March if that matters.
  schedule:
    - cron: "*/30 13-23 * * *"
    - cron: "*/30 0-3 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force an alert on the biggest current move (to test the whole chain)"
        type: boolean
        default: false

concurrency:
  group: market-watch # a long research run makes the next check wait instead of overlapping it
  cancel-in-progress: false

permissions: {} # nothing by default; each job asks for what it needs

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      fire: ${{ steps.watch.outputs.fire }}
      stamp: ${{ steps.watch.outputs.stamp }}
      prompt: ${{ steps.watch.outputs.prompt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # our git step passes the token in directly instead of saving it

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # uv installs pandas/numpy/yfinance in a few seconds vs ~20 for pip, and the whole check is ~30 s.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      # --system so plain `python` sees the packages, no venv to activate.
      - run: uv pip install --system -r requirements.txt

      - id: watch
        env:
          FORCE: ${{ inputs.force }} # empty on scheduled runs
        run: python watch.py

      # Headline text goes through env, never ${{ }} inside `run`, so a crafted headline can't inject shell commands.
      #
      # Where alerts go. ntfy is on by default: free, no account, one curl. The catch is that anyone who learns the
      # topic name can read the alerts. Two other options are below, commented out. To switch, uncomment its secrets
      # and its curl line here and in the publish job, add the secrets in Settings -> Secrets, and comment out ntfy.
      #
      # Telegram: private by default and has nice phone notifications. Setup takes ~5 minutes: message @BotFather,
      #   send /newbot and copy the token (TELEGRAM_TOKEN). Send your new bot any message, then open
      #   https://api.telegram.org/bot<token>/getUpdates and copy "chat":{"id": ...} (TELEGRAM_CHAT_ID).
      # Discord: good if you already live in a server, or want to share alerts with a group. In a channel:
      #   Edit Channel -> Integrations -> Webhooks -> New Webhook -> Copy URL (DISCORD_WEBHOOK). The URL is the
      #   only key, so anyone with it can post to the channel. Discord wants JSON, so jq builds it (jq comes with the runner).
      - name: Push the alert
        if: steps.watch.outputs.fire == 'true'
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
          # TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          # TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MSG: ${{ steps.watch.outputs.title }}
        run: |
          curl -s -H "Title: Market alert" -H "Priority: high" -d "$MSG" "https://ntfy.sh/$TOPIC"
          # curl -s "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="Market alert: $MSG"
          # jq -n --arg c "Market alert: $MSG" '{content: $c}' | curl -s -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"

      # Save the cooldown state before the long research job, so a failed research run can't cause repeat alerts.
      - name: Save state
        if: steps.watch.outputs.fire == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          url="https://x-access-token:$GH_TOKEN@github.com/$REPO.git"
          git config user.name "market-watch"
          git config user.email "market-watch@users.noreply.github.com"
          git add state.json
          git commit -m "market-watch: alert state"
          git pull --rebase "$url" main && git push "$url" HEAD:main

  research:
    needs: watch
    if: needs.watch.outputs.fire == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # the whole point of this job: no write access while Claude reads the web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      # Claude runs the data script with plain `python`, so the packages go in system-wide.
      - run: uv pip install --system -r requirements.txt

      # Claude Code CLI run directly, the same way the PC runs it. (anthropics/claude-code-action was tried first: its
      # requests were refused with "credit balance too low" while the same key worked from this machine and through
      # the same Claude Code version elsewhere. It also wrote the job's token into .git/config.) Pinned to a known version.
      - run: npm install -g @anthropic-ai/claude-code@2.1.325

      - name: Research the move
        env:
          # Pay-per-use API key. To run on a Claude Pro/Max plan instead, replace with:
          #   CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   (token from `claude setup-token`)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROMPT: ${{ needs.watch.outputs.prompt }} # through env, not pasted into the command, like the headlines
        # No git or gh, and the only shell command is the data script. The result line (cost, turns, errors) goes
        # to the log; the research itself stays out of the public log and lands in the report file.
        run: |
          claude -p "$PROMPT" --max-turns 60 --output-format json \
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Skill,Bash(python .claude/skills/move-report/scripts/move_data.py:*)" \
            > claude.json || true
          jq '{is_error, num_turns, total_cost_usd, duration_ms, result: (.result // "" | .[0:500])}' claude.json || cat claude.json

      # Hand the files to the publish job. Jobs run on separate machines, so files only travel as artifacts.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: data/moves
          if-no-files-found: ignore
          retention-days: 3

  publish:
    needs: [watch, research]
    if: always() && needs.watch.outputs.fire == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get the report
        uses: actions/download-artifact@v4
        continue-on-error: true # no artifact when research failed early; the next step reports that
        with:
          name: report
          path: data/moves

      - name: Save the report and push the summary
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
          # TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          # TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STAMP: ${{ needs.watch.outputs.stamp }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:$GH_TOKEN@github.com/$REPO.git"
          summary="data/moves/live/$STAMP-summary.txt"
          report="data/moves/live/$STAMP-move.md"
          link="https://github.com/$REPO/blob/main/$report"
          if [ ! -f "$summary" ]; then
            curl -s -H "Title: Research failed" -d "Check the Actions log for $STAMP" "https://ntfy.sh/$TOPIC"
            # curl -s "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="Research failed, check the Actions log for $STAMP"
            # jq -n --arg c "Research failed, check the Actions log for $STAMP" '{content: $c}' | curl -s -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
            exit 0
          fi
          # Keep the numbers the report quotes, one file per day: a later alert that day replaces it with fuller data.
          # (Yahoo drops 5-minute bars after ~60 days, so this is the only lasting copy of the intraday path.)
          mv -f data/moves/*-data.json data/moves/live/ 2>/dev/null || true
          git config user.name "market-watch"
          git config user.email "market-watch@users.noreply.github.com"
          git add data/moves/live
          git commit -m "market-watch: live report $STAMP"
          git pull --rebase "$url" main && git push "$url" HEAD:main
          curl -s -H "Title: Why it moved" -H "Click: $link" --data-binary "@$summary" "https://ntfy.sh/$TOPIC"
          # Telegram and Discord have no tap-to-open header, so the link goes at the end of the text.
          # curl -s "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$(cat "$summary") $link"
          # jq -n --rawfile s "$summary" --arg l "$link" '{content: ($s + "\n" + $l)}' | curl -s -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
